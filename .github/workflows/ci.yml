name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.3.4

      - name: Run ruff
        run: ruff check src/ tests/ ui/ scripts/ --select E,W,F,I

  typecheck:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run mypy
        run: mypy src/ --ignore-missing-imports --no-strict-optional

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: "sk-ant-dummy-for-ci"
      OPENAI_API_KEY: "sk-dummy-for-ci"
      LLM_PROVIDER: "anthropic"
      LLM_MODEL: "claude-sonnet-4-6"
      EMBEDDING_PROVIDER: "openai"
      EMBEDDING_MODEL: "text-embedding-3-small"
      DATABASE_URL: "sqlite+aiosqlite:///./test.db"
      ENABLE_TRACING: "false"
      LOG_LEVEL: "WARNING"
      AI_CALL_TPM_LIMIT: "1000000"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            -v --tb=short

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t smart-lost-and-found:ci \
            .

      - name: Smoke-test container starts
        run: |
          docker run --rm \
            -e ANTHROPIC_API_KEY=sk-ant-dummy \
            -e OPENAI_API_KEY=sk-dummy \
            -e DATABASE_URL=sqlite+aiosqlite:///./test.db \
            smart-lost-and-found:ci \
            python -c "from src.config import settings; print('settings OK')"
